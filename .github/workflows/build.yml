name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: RuboCop
      run: bundle exec rubocop
    - name: Reek
      run: bundle exec reek lib bin

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby-version: ['3.3', '3.4', '4.0']
        experimental: [false]
        include:
          # DBF data has a Windows/FoxPro heritage; exercise non-POSIX paths
          # and binary-mode reads on the platforms users actually run.
          - os: windows-latest
            ruby-version: '3.4'
            experimental: false
          - os: macos-latest
            ruby-version: '3.4'
            experimental: false
          # Observe-only: failures are reported but don't block the build.
          - os: ubuntu-latest
            ruby-version: head
            experimental: true
          - os: ubuntu-latest
            ruby-version: jruby
            experimental: true
          - os: ubuntu-latest
            ruby-version: truffleruby
            experimental: true

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake
